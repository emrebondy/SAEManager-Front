<div class="modal" tabindex="-1" id="modalCreateRendu" [ngClass]="{ 'show': showModal }" (click)="closeModal($event)">
  <div class="modal-dialog" (click)="stopPropagation($event)">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bolder text-center w-100">Créer un rendu</h5>
        <button type="button" class="btn-close" (click)="closeModal($event)" aria-label="Close"></button>
      </div>

      <div *ngIf="message" class="alert alert-success mt-3">
        {{ message }}
      </div>

      <form (ngSubmit)="submitRendu()">
        <div class="modal-body d-flex flex-column text-center">
          <div class="form-group mb-3">
            <input type="text" class="form-control" [(ngModel)]="newRendu.nom" name="titreRendu" id="titreRendu" placeholder="Titre du rendu" required>
          </div>

          <div class="form-group mb-3">
            <input type="datetime-local" class="form-control" [(ngModel)]="newRendu.dateLimite" name="dateLimiteRendu" id="dateLimiteRendu" required>
          </div>

          <div class="form-group mb-3 form-check">
            <input type="checkbox" class="form-check-input" [(ngModel)]="renduNote" name="renduNote" id="renduNote">
            <label class="form-check-label" for="renduNote">Rendu noté</label>
          </div>

          <div class="form-group mb-3" *ngIf="renduNote" id="coeffInput">
            <input type="number" class="form-control" [(ngModel)]="coef" name="coef" id="coef" placeholder="Coefficient" min="1" max="10">
          </div>

          <div>
            <button type="submit" class="btn btn-success m-3">Valider</button>
            <button type="button" class="btn btn-danger m-3" (click)="closeModal($event)">Annuler</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
