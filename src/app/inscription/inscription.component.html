<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow-lg bg-white rounded p-4 d-flex flex-column flex-md-row" style="max-width: 900px; width: 90%;">

    <div class="illustration-container">
      <img src="assets/images/Saly-13.png" alt="Illustration" class="img-fluid">
    </div>

    <div class="form-container">
      <h2 class="fw-bold text-center">Inscription</h2>
      <p class="text-center mt-2">
        Bienvenue sur <span class="text-danger fw-bold">SAÉ MANAGER</span>!
      </p>

      <form [formGroup]="accountCreationForm" (ngSubmit)="handleSubmit()" class="w-100">
        <div class="mb-3">
          <div class="input-group">
            <span class="input-group-text bg-light text-muted"></span>
            <input type="text" formControlName="lastname" class="form-control" placeholder="Nom" required>
          </div>
        </div>

        <div class="mb-3">
          <div class="input-group">
            <span class="input-group-text bg-light text-muted"></span>
            <input type="text" formControlName="firstname" class="form-control" placeholder="Prénom" required>
          </div>
        </div>

        <div class="mb-3">
          <div class="input-group">
            <span class="input-group-text bg-light text-muted"></span>
            <input type="text" formControlName="email" class="form-control" placeholder="Email (partie avant @)" required>
            <span class="input-group-text bg-light">&#64;iut.univ-paris8.fr</span>
          </div>
        </div>

        <div class="mb-3">
          <div class="input-group">
            <span class="input-group-text bg-light text-muted"></span>
            <input type="text" formControlName="username" class="form-control" placeholder="Choisissez un identifiant" required>
          </div>
        </div>

        <div class="mb-3">
          <div class="input-group">
            <span class="input-group-text bg-light text-muted"></span>
            <input type="password" formControlName="password" class="form-control" placeholder="Mot de passe" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="!accountCreationForm.valid">
          S'inscrire
        </button>
      </form>

      <div class="text-center mt-3">
        <p>Vous avez déjà un compte ? <a href="#" class="text-primary">Connectez-vous</a></p>
      </div>

      <div class="text-center mt-2">
        <p>Vous êtes enseignant ? <span class="text-muted">Contactez le support pour être inscrit en tant qu'enseignant.</span></p>
      </div>
    </div>
  </div>
</div>
