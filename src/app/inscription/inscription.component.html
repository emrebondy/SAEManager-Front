<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<h1 class="fw-bold text-center pt-4">Inscription</h1>
<body class="d-flex justify-content-center align-items-start vh-100 bg-light mt-5">

    <div class="card shadow bg-white rounded p-3 d-flex flex-column flex-md-row" style="max-width: 800px; width: 90%;">
        <div class="illustration-container d-flex justify-content-center align-items-center flex-column rounded-2" style="background: linear-gradient(to bottom right, #FF758C, #FF7EB3); width: 50%; padding: 20px; border-radius: 10px 0 0 10px;">
            <img src="assets/images/Saly-13.png" alt="Illustration" class="img-fluid">
        </div>
        <div class="form-container d-flex flex-column justify-content-center align-items-center p-3" style="width: 50%;">
            
            <p class="text-center">Bienvenue sur <span class="text-danger fw-bold">SAÉ MANAGER</span>, l’outil qui va te changer la vie !</p>
            <form class="w-100">
                <div class="mb-3">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" name="nom" class="form-control" placeholder="Nom" required>
                    </div>
                </div>
                <div class="mb-3">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" name="prenom" class="form-control" placeholder="Prénom" required>
                    </div>
                </div>
                <div class="mb-3">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="text" name="email" class="form-control" placeholder="Email universitaire" required pattern="^[^@]+$">
                        <span class="input-group-text">&#64;iut.univ-paris8.fr</span>
                    </div>
                </div>
                <div class="mb-3">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="Mot de passe" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100">S'inscrire</button>
            </form>
            <div class="text-center mt-3">
                <p>Vous avez déjà un compte ? <a href="#" class="btn btn-link">Connectez-vous</a></p>
            </div>
            <div class="text-center mt-3">
                <p>Vous êtes enseignant ? <span class="text-muted">Contactez le support pour être inscrit en tant qu'enseignant.</span></p>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
