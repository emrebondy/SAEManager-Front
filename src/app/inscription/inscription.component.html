<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css"> <!-- Lien vers le CSS personnalisé -->
</head>
<body>

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-lg bg-white rounded p-4 d-flex flex-column flex-md-row" style="max-width: 900px; width: 90%;">
        
        <!-- Section gauche avec l'image -->
        <div class="illustration-container">
            <img src="assets/images/Saly-13.png" alt="Illustration" class="img-fluid">
        </div>

        <!-- Section droite avec le formulaire -->
        <div class="form-container">
            <h2 class="fw-bold text-center">Inscription</h2>
            <p class="text-center mt-2">
                Bienvenue sur <span class="text-danger fw-bold">SAÉ MANAGER</span>, l’outil qui va te changer la vie !
            </p>

            <form [formGroup]="accountCreationForm" (ngSubmit)="handleSubmit()" class="w-100">
                <div class="mb-3">
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted">Nom</span>
                        <input type="text" formControlName="lastname" class="form-control" required>
                    </div>
                </div>
            
                <div class="mb-3">
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted">Prénom</span>
                        <input type="text" formControlName="firstname" class="form-control" required>
                    </div>
                </div>
            
                <div class="mb-3">
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted">Email universitaire</span>
                        <input type="email" formControlName="email" class="form-control" required>
                        <span class="input-group-text bg-light">&#64;iut.univ-paris8.fr</span>
                    </div>
                </div>
            
                <div class="mb-3">
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted">Mot de passe</span>
                        <input type="password" formControlName="password" class="form-control" required>
                    </div>
                </div>
            
                <button type="submit" class="btn btn-primary w-100" [disabled]="!accountCreationForm.valid">S'inscrire</button>
            </form>
            

            <div class="text-center mt-3">
                <p>Vous avez déjà un compte ? <a href="#" class="text-primary">Connectez-vous</a></p>
            </div>

            <div class="text-center mt-2">
                <p>Vous êtes enseignant ? <span class="text-muted">Contactez le support pour être inscrit en tant qu'enseignant.</span></p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
