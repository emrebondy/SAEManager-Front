<div class="container mt-5 h-100">
    <h1 class="fw-bold">LISTE DES SAÉ(S)</h1>

    <div class="card-general shadow bg-white rounded min-h75">
        <div class="d-flex align-items-center p-5 mx-5">
            <div class="me-3">
                <svg width="35" height="35">
                    <use xlink:href="#arrow-icon"></use>
                </svg>
            </div>

            <div class="d-flex flex-column">
                <h3 class="fw-bold">Liste des SAÉs créées manuellement :</h3>
                <p class="h5" *ngIf="saes.length === 0">Aucune SAE n'a été créée.</p>
            </div>
        </div>

        <!-- Liste des SAÉs -->
        <div class="sae-list" *ngIf="saes.length > 0">
            <div *ngFor="let sae of saes" class="sae-card p-3 my-3 bg-light shadow-sm rounded">
                <h4 class="fw-bold">{{ sae.nomSae }}</h4>
                <p><strong>Année :</strong> {{ sae.anneeUniversitaire }}</p>
                <p><strong>Semestre :</strong> {{ sae.semestreUniversitaire }}</p>
                <p><strong>Sujet :</strong> {{ sae.sujet }}</p>
                <p><strong>Dernière modification :</strong> {{ sae.dateModificationSujet }}</p>
            </div>
        </div>
    </div>
</div>
